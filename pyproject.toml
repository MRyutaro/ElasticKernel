[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-kernel"
version = "0.2.1"
description = "An IPython Kernel that automatically saves and restores Jupyter Notebook execution states."
authors = [
    { name = "ryutarom", email = "m2002r1028@icloud.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "dill",
    "ipykernel",
    "ipython",
    "networkx",
    "numpy",
    "xxhash",
    "jupyter_client",
    "jupyter",
]
keywords = ["jupyter", "kernel", "elastic", "checkpoint", "dependency-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Framework :: Jupyter",
]

[project.optional-dependencies]
# 外部オーケストレーター向け REST チェックポイント/復元 API（Jupyter Server 拡張）。
# jupyter_server は JupyterLab 環境には通常既に入っているが、この機能を使う意図を明示し
# 保証するため optional-dependencies に置く。有効化は `elastic-kernel install --server`。
server = ["jupyter_server"]

[project.urls]
Homepage = "https://github.com/MRyutaro/ElasticKernel"
Repository = "https://github.com/MRyutaro/ElasticKernel"
Documentation = "https://github.com/MRyutaro/ElasticKernel"
"Bug Tracker" = "https://github.com/MRyutaro/ElasticKernel/issues"

[project.scripts]
elastic-kernel = "elastic_kernel.command:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elastic_kernel*", "elastic_notebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.mypy]
files = ["elastic_kernel", "elastic_notebook"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"elastic_kernel" = ["kernel.json", "kernel.py"]

[dependency-groups]
dev = [
    "black>=24.8.0",
    "build>=1.2.2.post1",
    "flake8>=5.0.4",
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "twine>=6.1.0",
]

# Libraries whose checkpoint round-trip coverage is verified in CI (issue #48).
# Kept in sync with tests/library_specimens.py. CPU-only builds; no GPU stacks.
coverage = [
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "opencv-python-headless",
    "requests",
]

[tool.uv.sources]
# “torch” パッケージは常に “pytorch-cpu” インデックスからのみ取得
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"
explicit = true
