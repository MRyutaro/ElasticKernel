name: Auto Format Python Code

permissions:
  contents: write

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  auto-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # pull_request ではマージ commit が detached HEAD でチェックアウトされ
          # git push が失敗する。PR の元ブランチを明示してブランチ状態にする。
          # push（main）イベント時は github.head_ref が空なので既定の挙動になる。
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install formatters (isort, black)
        run: |
          python -m pip install --upgrade pip
          pip install isort black

      - name: Run isort
        run: isort .

      - name: Run black
        run: black .

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "style: auto-format with isort and black"
          git push
