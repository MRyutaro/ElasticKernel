name: Library coverage

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  library-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pinned so the verified-version table in the READMEs is reproducible:
          # scripts/library_coverage.py reads the installed versions, and the drift
          # check below compares them against the committed table.
          python-version: "3.11"

      - name: Install dependencies (with coverage group)
        run: uv sync --group coverage

      - name: Run round-trip coverage tests
        run: uv run pytest tests/test_library_coverage.py -v

      - name: Verify README coverage table is up to date
        run: uv run python scripts/library_coverage.py --check
