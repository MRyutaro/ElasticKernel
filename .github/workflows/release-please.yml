name: release-please

# main へのマージ内容（Conventional Commits）からバージョンを判定し、
# CHANGELOG とバージョン更新をまとめた「リリース PR」を自動で作成・更新する。
# その PR をマージすると v{version} タグと GitHub Release が作られ、
# 既存の publish-to-pypi.yml / docker-publish.yml（タグ起動）が発火して公開される。
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GitHub App トークンを実行時に発行する。GITHUB_TOKEN で作ったタグは他ワークフロー
      # を起動できない（GitHub の仕様）ため、公開ワークフロー（PyPI / GHCR）を自動発火
      # させるには App トークンでタグを打つ必要がある。
      # App ID と秘密鍵は Secrets（RELEASE_PLEASE_APP_ID / RELEASE_PLEASE_APP_PRIVATE_KEY）に設定する。
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
